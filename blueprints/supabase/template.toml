[variables]
main_domain = "${domain}"

# Secrets
postgres_password = "${password:32}"
jwt_secret = "${base64:64}"
secret_key_base = "${base64:64}"
anon_key = "${base64:32}"
service_role_key = "${base64:32}"
logflare_api_key = "${base64:32}"

[config]
[[config.domains]]
serviceName = "supabase-studio"
port = 3000
host = "supabase.${main_domain}"

[[config.domains]]
serviceName = "supabase-kong"
port = 8000
host = "api.${main_domain}"

[config.env]
POSTGRES_PASSWORD="${{project.POSTGRES_PASSWORD}}"
POSTGRES_DB="${{project.POSTGRES_DB}}"
JWT_SECRET="${{project.JWT_SECRET}}"
JWT_EXPIRY=3600
SECRET_KEY_BASE="${{project.SECRET_KEY_BASE}}"
ANON_KEY="${{project.ANON_KEY}}"
SERVICE_ROLE_KEY="${{project.SERVICE_ROLE_KEY}}"
LOGFLARE_API_KEY="${{project.LOGFLARE_API_KEY}}"
PGRST_DB_SCHEMAS="${{project.PGRST_DB_SCHEMAS}}"
SUPABASE_PUBLIC_URL="${{project.SUPABASE_PUBLIC_URL}}"
API_EXTERNAL_URL="${{project.API_EXTERNAL_URL}}"
SITE_URL="${{project.SITE_URL}}"
DASHBOARD_USERNAME="${{project.ADMIN_USER}}"
DASHBOARD_PASSWORD="${{project.ADMIN_PASSWORD}}"
STUDIO_DEFAULT_ORGANIZATION=IA Stack
STUDIO_DEFAULT_PROJECT=ia-stack
STORAGE_BACKEND=file
DISABLE_SIGNUP=false
ENABLE_EMAIL_SIGNUP=true
ENABLE_ANONYMOUS_USERS=false
ENABLE_EMAIL_AUTOCONFIRM=false
SUPABASE_DB_URL="${{project.POSTGRES_URL}}"

# OpenAI Configuration (optional)
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"
STUDIO_DEFAULT_ORGANIZATION = "IA Stack"
STUDIO_DEFAULT_PROJECT = "ia-stack"
STORAGE_BACKEND = "file"

# Authentication
DISABLE_SIGNUP = "false"
ENABLE_EMAIL_SIGNUP = "true"
ENABLE_ANONYMOUS_USERS = "false"
ENABLE_EMAIL_AUTOCONFIRM = "false"

[[config.mounts]]
volumeName = "supabase-db-data"
mountPath = "/var/lib/postgresql/data"

[[config.mounts]]
volumeName = "supabase-storage-data"
mountPath = "/var/lib/storage"