services:
  integration-hub:
    image: ghcr.io/integration-hub/integration-hub:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # API Configuration
      HUB_API_KEY: ${HUB_API_KEY}
      HUB_SECRET: ${HUB_SECRET}
      # Database Configuration (connect to external Supabase)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      # Redis Configuration
      REDIS_URL: redis://${REDIS_HOST}:6379/0
      # S3 Configuration
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${S3_BUCKET}
      AWS_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_S3_REGION_NAME: ${S3_REGION}
    volumes:
      - integration-hub-data:/app/data
      - integration-hub-config:/app/config

volumes:
  integration-hub-data:
  integration-hub-config: