[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "hoppscotch"
port = 3000
host = "hoppscotch.${main_domain}"

[[config.domains]]
serviceName = "hoppscotch"
port = 3001
host = "hoppscotch-secure.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# Redis Configuration (connect to external Redis)
REDIS_HOST = "redis"

# OpenAI Configuration (optional)
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

[[config.mounts]]
volumeName = "hoppscotch-data"
mountPath = "/var/www/html/storage"