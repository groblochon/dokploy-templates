services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    container_name: hoppscotch
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "${PORT_SECURE:-3001}:3001"
    environment:
      # Database Configuration (connect to external Supabase)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      # Redis Configuration (connect to external Redis)
      REDIS_URL: redis://${REDIS_HOST}:6379
      # OpenAI Configuration (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
    volumes:
      - hoppscotch-data:/var/www/html/storage

volumes:
  hoppscotch-data: