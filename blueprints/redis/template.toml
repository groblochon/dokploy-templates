[variables]
main_domain = "${domain}"
redis_password = "${password:32}"

[config]
[[config.domains]]
serviceName = "redis"
port = 6379
host = "redis.${main_domain}"

[config.env]
# Redis Configuration
REDIS_PASSWORD = "${{project.REDIS_PASSWORD}}"
# Project variable for external connections (used by other services)
REDIS_URL = "${{project.REDIS_URL}}"

[[config.mounts]]
volumeName = "redis-data"
mountPath = "/data"