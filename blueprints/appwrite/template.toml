[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "appwrite"
port = 80
host = "appwrite.${main_domain}"

[[config.domains]]
serviceName = "appwrite"
port = 80
host = "appwrite-api.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"
POSTGRES_URL = "postgresql://postgres:${{project.POSTGRES_PASSWORD}}@${{project.POSTGRES_HOST}}:5432/${{project.POSTGRES_DB}}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# S3 Configuration
_APPWRITE_STORAGE_S3_ACCESS_KEY = "${{project.S3_ACCESS_KEY_ID}}"
_APPWRITE_STORAGE_S3_SECRET_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"
_APPWRITE_STORAGE_S3_REGION = "${{project.S3_REGION}}"
_APPWRITE_STORAGE_S3_BUCKET = "${{project.S3_BUCKET}}"
_APPWRITE_STORAGE_S3_ENDPOINT = "${{project.S3_ENDPOINT}}"
_APPWRITE_STORAGE_S3_FORCE_PATH_STYLE = "true"

[[config.mounts]]
volumeName = "appwrite-uploads"
mountPath = "/var/www/appwrite"