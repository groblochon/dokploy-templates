services:
  appwrite:
    image: appwrite/appwrite:1.5.0
    container_name: appwrite
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      _APPWRITE_DB_DATA_SOURCE: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      _APPWRITE_DB_DATA_SOURCE_TABLE: appwrite
      # OpenAI Configuration
      _APPWRITE_OPENAI_API_KEY: ${OPENAI_API_KEY}
      _APPWRITE_OPENAI_BASE_URL: ${OPENAI_API_BASE}
    ports:
      - "${PORT:-80}:80"
      - "${PORT_HTTP:-80}:80"
      - "${PORT_REALTIME:-80}:80"
    volumes:
      - appwrite-uploads:/var/www/appwrite
    depends_on:
      - supabase-db

volumes:
  appwrite-uploads: