services:
  appwrite:
    image: appwrite/appwrite:1.8.0
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      APPWRITE_DB_DATA_SOURCE: postgresql://postgres:${{project.POSTGRES_PASSWORD}}@${{project.POSTGRES_HOST}}:5432/${{project.POSTGRES_DB}}
      _APPWRITE_DB_DATA_SOURCE_TABLE: appwrite
      # OpenAI Configuration
      APPWRITE_OPENAI_API_KEY: "${{project.OPENAI_API_KEY}}"
      APPWRITE_OPENAI_BASE_URL: "${{project.OPENAI_API_BASE}}"
      # Encryption Keys
      _APPWRITE_ENCRYPTION_KEY: "${password:32}"
      _APPWRITE_OPENSSL_KEY_V1: "${password:32}"
      _APPWRITE_RSA_KEY_V1: "${password:32}"
    expose:
      - 80
    volumes:
      - appwrite-uploads:/var/www/appwrite

volumes:
  appwrite-uploads: