version: "3.8"

services:
  appwrite:
    image: appwrite/appwrite:1.8.0
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      APPWRITE_DB_DATA_SOURCE: "${POSTGRES_URL}"
      # OpenAI Configuration
      APPWRITE_OPENAI_API_KEY: "${OPENAI_API_KEY}"
      APPWRITE_OPENAI_BASE_URL: "${OPENAI_API_BASE}"
      # Encryption Keys
      APPWRITE_ENCRYPTION_KEY: "${password:32}"
      APPWRITE_OPENSSL_KEY_V1: "${password:32}"
      APPWRITE_RSA_KEY_V1: "${password:32}"
      # S3 Configuration (using project variables)
      _APPWRITE_STORAGE_S3_ACCESS_KEY: "${S3_ACCESS_KEY_ID}"
      _APPWRITE_STORAGE_S3_SECRET_KEY: "${S3_SECRET_ACCESS_KEY}"
      _APPWRITE_STORAGE_S3_REGION: "${S3_REGION}"
      _APPWRITE_STORAGE_S3_BUCKET: "${S3_BUCKET}"
      _APPWRITE_STORAGE_S3_ENDPOINT: "${S3_ENDPOINT}"
      _APPWRITE_STORAGE_S3_FORCE_PATH_STYLE: "true"
    expose:
      - 80
    volumes:
      - appwrite-uploads:/var/www/appwrite

volumes:
  appwrite-uploads: {}