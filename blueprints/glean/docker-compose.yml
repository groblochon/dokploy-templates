services:
  glean-backend:
    build:
      context: https://github.com/LeslieLeung/glean.git#main:backend
    restart: unless-stopped
    expose:
      - 8000
    environment:
      # Database Configuration (connect to external Supabase)
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      # Redis Configuration (connect to external Redis)
      REDIS_URL: redis://${REDIS_HOST}:6379/0
      # Secrets
      SECRET_KEY: ${GLEAN_SECRET_KEY}
      # Admin Configuration
      CREATE_ADMIN: "true"
      ADMIN_USERNAME: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_ROLE: super_admin
      # Config
      DEBUG: "false"
      RUN_MIGRATIONS: "true"
      CORS_ORIGINS: '["https://${GLEAN_HOST}", "https://${GLEAN_ADMIN_HOST}"]'
      # Milvus - Vector DB pour recommandations IA
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # OpenAI pour embeddings
      EMBEDDING_PROVIDER: openai
      EMBEDDING_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_BASE_URL: ${OPENAI_API_BASE}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: 1536
    volumes:
      - glean-logs:/app/logs
    depends_on:
      - milvus

  glean-worker:
    build:
      context: https://github.com/LeslieLeung/glean.git#main:backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_HOST}:6379/0
      SECRET_KEY: ${GLEAN_SECRET_KEY}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      EMBEDDING_PROVIDER: openai
      EMBEDDING_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_BASE_URL: ${OPENAI_API_BASE}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: 1536
    volumes:
      - glean-logs:/app/logs
    depends_on:
      - glean-backend
      - milvus
    command: [ "uv", "run", "--no-sync", "arq", "glean_worker.main.WorkerSettings" ]

  glean-web:
    build:
      context: https://github.com/LeslieLeung/glean.git#main:frontend
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      - glean-backend

  glean-admin:
    build:
      context: https://github.com/LeslieLeung/glean.git#main:frontend
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      - glean-backend

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY}
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.6
    restart: unless-stopped
    expose:
      - 19530
      - 9091
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  glean-logs:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data: