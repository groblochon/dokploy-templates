[variables]
main_domain = "${domain}"
nextauth_secret = "${base64:64}"

[config]
[[config.domains]]
serviceName = "karakeep"
port = 3000
host = "karakeep.${main_domain}"

[config.env]
# Secrets
NEXTAUTH_SECRET = "${nextauth_secret}"

# External Meilisearch Configuration
MEILI_ADDR = "${{project.MEILI_ADDR}}"
MEILI_MASTER_KEY = "${{project.MEILI_MASTER_KEY}}"

# Configuration
KARAKEEP_HOST = "karakeep.${main_domain}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# S3 Configuration
S3_ENDPOINT = "${{project.S3_ENDPOINT}}"
S3_REGION = "${{project.S3_REGION}}"
S3_BUCKET = "${{project.S3_BUCKET}}"
S3_ACCESS_KEY_ID = "${{project.S3_ACCESS_KEY_ID}}"
S3_SECRET_ACCESS_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"

[[config.mounts]]
volumeName = "karakeep-data"
mountPath = "/data"