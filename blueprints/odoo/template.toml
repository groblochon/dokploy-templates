[variables]
main_domain = "${domain}"
odoo_password = "${password:32}"

[config]
[[config.domains]]
serviceName = "odoo"
port = 8069
host = "odoo.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# OpenAI Configuration (optional)
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# S3 Configuration
S3_ENDPOINT = "${{project.S3_ENDPOINT}}"
S3_REGION = "${{project.S3_REGION}}"
S3_BUCKET = "${{project.S3_BUCKET}}"
S3_ACCESS_KEY_ID = "${{project.S3_ACCESS_KEY_ID}}"
S3_SECRET_ACCESS_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"

[[config.mounts]]
volumeName = "odoo-web-data"
mountPath = "/var/lib/odoo"

[[config.mounts]]
volumeName = "odoo-config"
mountPath = "/etc/odoo"

[[config.mounts]]
volumeName = "odoo-addons"
mountPath = "/mnt/extra-addons"

[[config.mounts]]
volumeName = "odoo-db-data"
mountPath = "/var/lib/postgresql/data/pgdata"