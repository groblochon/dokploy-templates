services:
  odoo:
    image: odoo:17.0
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      HOST: "${POSTGRES_HOST}}"
      USER: "postgres"
      PASSWORD: "${POSTGRES_PASSWORD}}"
      # OpenAI Configuration (using project variables)
      OPENAI_API_KEY: "${OPENAI_API_KEY}}"
      OPENAI_API_BASE: "${OPENAI_API_BASE}}"
      # S3 Configuration (using project variables)
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}}"
      AWS_STORAGE_BUCKET_NAME: "${S3_BUCKET}}"
      AWS_S3_ENDPOINT_URL: "${S3_ENDPOINT}}"
      AWS_S3_REGION_NAME: "${S3_REGION}}"
      # Application Configuration
      ODOO_RC: "/etc/odoo/odoo.conf"
      ODOO_ADMIN_PASS: "${password:32}"
      ODOO_DB_HOST: "${POSTGRES_HOST}}"
      ODOO_DB_PORT: "5432"
      ODOO_DB_USER: "postgres"
      ODOO_DB_PASSWORD: "${POSTGRES_PASSWORD}}"
      ODOO_DB_NAME: "odoo"
      ODOO_DB_MAXCONN: "64"
      ODOO_DB_TEMPLATE: "template0"
      ODOO_DB_FILTER: "odoo"
    expose:
      - 8069
    volumes:
      - odoo-web-data:/var/lib/odoo
      - odoo-config:/etc/odoo
      - odoo-addons:/mnt/extra-addons

volumes:
  odoo-web-data:
  odoo-config:
  odoo-addons: