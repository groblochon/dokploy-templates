[variables]
main_domain = "${domain}"
huly_secret_key = "${base64:32}"
huly_mongodb_password = "${password:16}"

[config]
[[config.domains]]
serviceName = "huly"
port = 3000
host = "huly.${main_domain}"

[config.env]
# Secrets
HULY_SECRET_KEY = "${huly_secret_key}"
HULY_MONGODB_PASSWORD = "${huly_mongodb_password}"

# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# OpenAI Configuration (optional)
OPENAI_API_BASE = "${{project.OPEN_AI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPEN_AI_API_KEY}}"

# Configuration
HULY_HOST = "huly.${main_domain}"
ADMIN_USER = "${{project.ADMIN_USER}}"
ADMIN_EMAIL = "${{project.ADMIN_EMAIL}}"
ADMIN_PASSWORD = "${{project.ADMIN_PASSWORD}}"

[[config.mounts]]
volumeName = "huly-data"
mountPath = "/app/uploads"

[[config.mounts]]
volumeName = "huly-mongodb-data"
mountPath = "/data/db"