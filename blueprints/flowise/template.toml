[variables]
main_domain = "${domain}"

# Secrets
flowise_secret_key = "${base64:32}"
flowise_passphrase = "${password:16}"
jwt_secret = "${base64:64}"

[config]
[[config.domains]]
serviceName = "flowise"
port = 3000
host = "flowise.${main_domain}"

[config.env]
# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# Redis Configuration (connect to external Redis)
REDIS_HOST = "${{project.REDIS_HOST}}"

# Secrets
FLOWISE_SECRET_KEY = "${flowise_secret_key}"
JWT_SECRET = "${jwt_secret}"
FLOWISE_PASSPHRASE = "${flowise_passphrase}"

[[config.mounts]]
volumeName = "flowise-data"
mountPath = "/root/.flowise"