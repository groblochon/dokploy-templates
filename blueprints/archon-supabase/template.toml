[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
dashboard_password = "${password:32}"
logflare_api_key = "${password:32}"
secret_key_base = "${password:64}"
vault_enc_key = "${password:32}"
jwt_secret = "${password:32}"
container_name_prefix = "${APP_NAME}-supabase"
anon_key_payload = """{
  "role": "anon",
  "iss": "supabase",
  "exp": ${timestamps:2030-01-01T00:00:00Z}
}
"""
service_role_key_payload = """{
  "role": "service_role",
  "iss": "supabase",
  "exp": ${timestamps:2030-01-01T00:00:00Z}
}
"""

[config]
[[config.domains]]
serviceName = "archon-frontend"
port = 3737
host = "archon.${main_domain}"

[[config.domains]]
serviceName = "kong"
port = 8000
host = "api-supabase.${main_domain}"

[[config.domains]]
serviceName = "studio"
port = 3000
host = "supabase.${main_domain}"

[[config.domains]]
serviceName = "auth"
port = 9999
host = "auth-supabase.${main_domain}"

[config.env]
############
# Archon + Supabase Local Development Environment Configuration
# 
# This configuration template combines:
# - Archon AI Platform: https://github.com/coleam00/Archon (by @coleam00)
# - Supabase Backend: https://github.com/supabase/supabase (Apache 2.0 License)
#
# Based on official Supabase environment configuration
# 
############
# Secrets
# YOU MUST CHANGE THESE BEFORE GOING INTO PRODUCTION
############

POSTGRES_PASSWORD=${postgres_password}
# IMPORTANT: Generate your own 32+ character JWT secret
JWT_SECRET=${jwt_secret}

# IMPORTANT: Generate these keys using your JWT_SECRET with the Supabase JWT Generator
# Visit: https://supabase.com/docs/guides/self-hosting/docker (scroll to JWT Generator section)
# Use the JWT Generator tool to create tokens with:
# 1. For ANON_KEY: role="anon", iss="supabase"
# 2. For SERVICE_ROLE_KEY: role="service_role", iss="supabase"
ANON_KEY=${jwt:jwt_secret:anon_key_payload}
SERVICE_ROLE_KEY=${jwt:jwt_secret:service_role_key_payload}
DASHBOARD_USERNAME=${{project.ADMIN_USER}}
DASHBOARD_PASSWORD=${{project.ADMIN_PASSWORD}}
SECRET_KEY_BASE=${secret_key_base}
VAULT_ENC_KEY=${vault_enc_key}


############
# Database - You can change these to any PostgreSQL database that has logical replication enabled.
############

POSTGRES_HOST=db
POSTGRES_DB=postgres
POSTGRES_PORT=5432
# default user is postgres


############
# Supavisor -- Database pooler
############
# Port Supavisor listens on for transaction pooling connections
POOLER_PROXY_PORT_TRANSACTION=6543
# Maximum number of PostgreSQL connections Supavisor opens per pool
POOLER_DEFAULT_POOL_SIZE=20
# Maximum number of client connections Supavisor accepts per pool
POOLER_MAX_CLIENT_CONN=100
# Unique tenant identifier
POOLER_TENANT_ID=your-tenant-id
# Pool size for internal metadata storage used by Supavisor
# This is separate from client connections and used only by Supavisor itself
POOLER_DB_POOL_SIZE=5


############
# API Proxy - Configuration for the Kong Reverse proxy.
############

KONG_HTTP_PORT=8000
KONG_HTTPS_PORT=8443


############
# API - Configuration for PostgREST.
############

PGRST_DB_SCHEMAS=public,storage,graphql_public


############
# Auth - Configuration for the GoTrue authentication server.
############

## General
SITE_URL=https://supabase.${main_domain}
ADDITIONAL_REDIRECT_URLS=
JWT_EXPIRY=3600
DISABLE_SIGNUP=false
API_EXTERNAL_URL=https://api-supabase.${main_domain}

## Mailer Config
MAILER_URLPATHS_CONFIRMATION="/auth/v1/verify"
MAILER_URLPATHS_INVITE="/auth/v1/verify"
MAILER_URLPATHS_RECOVERY="/auth/v1/verify"
MAILER_URLPATHS_EMAIL_CHANGE="/auth/v1/verify"

## Email auth
ENABLE_EMAIL_SIGNUP=true
ENABLE_EMAIL_AUTOCONFIRM=false
SMTP_ADMIN_EMAIL=admin@example.com
SMTP_HOST=supabase-mail
SMTP_PORT=2500
SMTP_USER=fake_mail_user
SMTP_PASS=fake_mail_password
SMTP_SENDER_NAME=fake_sender
ENABLE_ANONYMOUS_USERS=false

## Phone auth
ENABLE_PHONE_SIGNUP=true
ENABLE_PHONE_AUTOCONFIRM=true


############
# Studio - Configuration for the Dashboard
############

STUDIO_DEFAULT_ORGANIZATION=Default Organization
STUDIO_DEFAULT_PROJECT=Default Project

STUDIO_PORT=3000
# replace if you intend to use Studio outside of localhost
SUPABASE_PUBLIC_URL=https://supabase.${main_domain}

# Enable webp support
IMGPROXY_ENABLE_WEBP_DETECTION=true

# Add your OpenAI API key to enable SQL Editor Assistant (optional)
OPENAI_API_KEY=${{project.OPENAI_API_KEY}}


############
# Functions - Configuration for Functions
############
# NOTE: VERIFY_JWT applies to all functions. Per-function VERIFY_JWT is not supported yet.
FUNCTIONS_VERIFY_JWT=false


############
# Logs - Configuration for Analytics
# Please refer to https://supabase.com/docs/reference/self-hosting-analytics/introduction
############

# Change vector.toml sinks to reflect this change
# these cannot be the same value
# LOGFLARE_PUBLIC_ACCESS_TOKEN=your-super-secret-and-long-logflare-key-public
# LOGFLARE_PRIVATE_ACCESS_TOKEN=your-super-secret-and-long-logflare-key-private

# Docker socket location - this value will differ depending on your OS
DOCKER_SOCKET_LOCATION=/var/run/docker.sock

# Google Cloud Project details
GOOGLE_PROJECT_ID=GOOGLE_PROJECT_ID
GOOGLE_PROJECT_NUMBER=GOOGLE_PROJECT_NUMBER


############
# ARCHON - Configuration for Archon AI application
############

# Port configurations for Archon services
ARCHON_SERVER_PORT=8181
ARCHON_MCP_PORT=8051
ARCHON_AGENTS_PORT=8052
ARCHON_UI_PORT=3737

# Host configuration
HOST=archon.${main_domain}

# Optional: OpenAI API key for Archon AI features (can be configured via UI)
OPENAI_API_KEY=${{project.OPENAI_API_KEY}}

# Optional: Logfire token for observability
# LOGFIRE_TOKEN=your-logfire-token

# Log level (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL=INFO