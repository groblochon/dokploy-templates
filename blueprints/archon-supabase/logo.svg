<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Archon AI Brain Icon (left side) -->
  <g transform="translate(20, 30)">
    <!-- Brain shape -->
    <path d="M15 25 Q5 25 5 35 Q5 45 10 50 L10 55 Q10 65 20 65 Q30 65 30 55 L30 50 Q35 45 35 35 Q35 25 25 25 Q20 20 15 25" 
          fill="#8b5cf6" opacity="0.9"/>
    
    <!-- Neural connections -->
    <circle cx="15" cy="35" r="2" fill="#fbbf24"/>
    <circle cx="25" cy="35" r="2" fill="#fbbf24"/>
    <circle cx="20" cy="42" r="2" fill="#fbbf24"/>
    <line x1="15" y1="35" x2="25" y2="35" stroke="#fbbf24" stroke-width="1"/>
    <line x1="15" y1="35" x2="20" y2="42" stroke="#fbbf24" stroke-width="1"/>
    <line x1="25" y1="35" x2="20" y2="42" stroke="#fbbf24" stroke-width="1"/>
    
    <!-- AI spark -->
    <g transform="translate(20, 30)">
      <path d="M0 -8 L3 -3 L8 -4 L3 0 L4 5 L0 2 L-4 5 L-3 0 L-8 -4 L-3 -3 Z" 
            fill="#fbbf24" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Supabase Database Icon (right side) -->
  <g transform="translate(65, 30)">
    <!-- Database cylinder -->
    <ellipse cx="20" cy="15" rx="18" ry="6" fill="#3ecf8e"/>
    <rect x="2" y="15" width="36" height="30" fill="#3ecf8e"/>
    <ellipse cx="20" cy="45" rx="18" ry="6" fill="#2eb37c"/>
    <ellipse cx="20" cy="15" rx="18" ry="6" fill="#4aed8c"/>
    
    <!-- Database lines -->
    <line x1="2" y1="22" x2="38" y2="22" stroke="#2eb37c" stroke-width="1"/>
    <line x1="2" y1="30" x2="38" y2="30" stroke="#2eb37c" stroke-width="1"/>
    <line x1="2" y1="38" x2="38" y2="38" stroke="#2eb37c" stroke-width="1"/>
  </g>
  
  <!-- Connection/Integration symbol (center) -->
  <g transform="translate(50, 45)">
    <circle cx="10" cy="15" r="3" fill="#f59e0b"/>
    <circle cx="0" cy="10" r="2" fill="#f59e0b"/>
    <circle cx="20" cy="10" r="2" fill="#f59e0b"/>
    <circle cx="10" cy="20" r="2" fill="#f59e0b"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="10" x2="10" y2="20" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="10" x2="10" y2="20" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Bottom text indicator -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#94a3b8">
    ARCHON + SUPABASE
  </text>
  
  <!-- Status indicator dots -->
  <circle cx="25" cy="110" r="2" fill="#10b981"/>
  <circle cx="35" cy="110" r="2" fill="#3b82f6"/>
  <circle cx="45" cy="110" r="2" fill="#8b5cf6"/>
  <circle cx="55" cy="110" r="2" fill="#f59e0b"/>
  <circle cx="65" cy="110" r="2" fill="#ef4444"/>
  <circle cx="75" cy="110" r="2" fill="#3ecf8e"/>
  <circle cx="85" cy="110" r="2" fill="#fbbf24"/>
  <circle cx="95" cy="110" r="2" fill="#06b6d4"/>
</svg>