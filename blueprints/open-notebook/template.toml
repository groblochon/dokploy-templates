[variables]
main_domain = "${domain}"
surreal_password = "${password:16}"

[config]
[[config.domains]]
serviceName = "open-notebook"
port = 8502
host = "notebook.${main_domain}"

[config.env]
# SurrealDB Configuration
SURREAL_PASSWORD = "${surreal_password}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

[[config.mounts]]
volumeName = "open-notebook-data"
mountPath = "/app/data"

[[config.mounts]]
volumeName = "surrealdb-data"
mountPath = "/mydata"