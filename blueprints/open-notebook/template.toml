[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "open-notebook"
port = 8502
host = "notebook.${main_domain}"

[config.env]
# SurrealDB Configuration (connect to external service)
SURREAL_URL = "${{project.SURREAL_URL}}"
SURREAL_PASSWORD = "${{project.SURREAL_PASSWORD}}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

[[config.mounts]]
volumeName = "open-notebook-data"
mountPath = "/app/data"