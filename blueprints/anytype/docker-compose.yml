services:
  anytype:
    image: anyproto/any-sync-node:latest
    container_name: anytype
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      ANY_SYNC_DATABASE_URL: "${POSTGRES_URL}"
      # S3 Storage Configuration
      ANY_SYNC_S3_ENDPOINT: "${S3_ENDPOINT}"
      ANY_SYNC_S3_REGION: "${S3_REGION}"
      ANY_SYNC_S3_BUCKET: "${S3_BUCKET}"
      ANY_SYNC_S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      ANY_SYNC_S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
    ports:
      - "${PORT:-3033}:3033"
    volumes:
      - anytype-data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://anytype:3033/api/v1/status" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  anytype-data: {}
