[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "archon-frontend"
port = 3737
host = "archon.${main_domain}"

[config.env]
# Supabase Configuration (connect to integrated Supabase)
SUPABASE_URL = "https://api-supabase.${main_domain}"
SUPABASE_ANON_KEY = "${ANON_KEY}"
SUPABASE_SERVICE_KEY = "${SERVICE_ROLE_KEY}"

# Direct database connection via pooler (for performance)
DATABASE_URL = "postgresql://supabase_archon_admin:${{project.POSTGRES_PASSWORD}}@supabase-pooler.supabase-project.svc.cluster.local:6543/postgres"

# Archon Integration Variables
ARCHON_DB_CONNECTION = "${{project.ARCHON_DB_CONNECTION}}"
ARCHON_SECRET_KEY = "${{project.ARCHON_SECRET_KEY}}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# Crawl4AI Configuration (connect to external service)
CRAWL4AI_URL = "${{project.CRAWL4AI_URL}}"

# Additional Archon Configuration (commented - uncomment if needed)
# LOGFIRE_TOKEN = "${{project.LOGFIRE_TOKEN}}"
SERVICE_DISCOVERY_MODE = "dokploy"
LOG_LEVEL = "INFO"
ARCHON_SERVER_PORT = "8181"
ARCHON_MCP_PORT = "8051"
ARCHON_AGENTS_PORT = "8052"
AGENTS_ENABLED = "true"