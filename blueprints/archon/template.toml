[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "archon-frontend"
port = 3737
host = "archon.${main_domain}"

[config.env]
# Supabase Configuration (connect to external Supabase)
SUPABASE_URL = "${{project.SUPABASE_URL}}"
SUPABASE_ANON_KEY = "${{project.SUPABASE_ANON_KEY}}"
SUPABASE_SERVICE_KEY = "${{project.SUPABASE_SERVICE_KEY}}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# Crawl4AI Configuration (connect to external service)
CRAWL4AI_URL = "${{project.CRAWL4AI_URL}}"

# Additional Archon Configuration (commented - uncomment if needed)
# LOGFIRE_TOKEN = "${{project.LOGFIRE_TOKEN}}"
SERVICE_DISCOVERY_MODE = "dokploy"
LOG_LEVEL = "INFO"
ARCHON_SERVER_PORT = "8181"
ARCHON_MCP_PORT = "8051"
ARCHON_AGENTS_PORT = "8052"
AGENTS_ENABLED = "true"