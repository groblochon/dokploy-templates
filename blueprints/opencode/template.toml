[variables]
main_domain = "${domain}"
mcp_server_port = "8080"

[config]
[[config.domains]]
serviceName = "opencode"
port = 3100
host = "opencode.${main_domain}"

[[config.domains]]
serviceName = "mcp-server"
port = ${mcp_server_port}
host = "mcp.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# OpenAI Configuration
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# MCP Configuration
MCP_SERVER_HOST = "0.0.0.0"
MCP_SERVER_PORT = "${mcp_server_port}"

# S3 Configuration
S3_ENDPOINT = "${{project.S3_ENDPOINT}}"
S3_REGION = "${{project.S3_REGION}}"
S3_BUCKET = "${{project.S3_BUCKET}}"
S3_ACCESS_KEY_ID = "${{project.S3_ACCESS_KEY_ID}}"
S3_SECRET_ACCESS_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"

# Redis Configuration (connect to external Redis)
REDIS_HOST = "${{project.REDIS_HOST}}"

[[config.mounts]]
volumeName = "opencode-data"
mountPath = "/app/data"

[[config.mounts]]
volumeName = "opencode-workspace"
mountPath = "/app/workspace"

[[config.mounts]]
volumeName = "mcp-data"
mountPath = "/app/mcp-data"

[[config.mounts]]
volumeName = "mcp-logs"
mountPath = "/app/logs"