services:
  opencode:
    image: opencodegen/opencodegen:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    environment:
      # Database Configuration (connect to external Supabase)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      # MCP Server Configuration
      MCP_SERVER_HOST: ${MCP_SERVER_HOST:-0.0.0.0}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-8080}
      # S3 Configuration for sharing
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${S3_BUCKET}
      AWS_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_S3_REGION_NAME: ${S3_REGION}
      # Redis Configuration
      REDIS_URL: redis://${REDIS_HOST}:6379/0
    volumes:
      - opencode-data:/app/data
      - opencode-workspace:/app/workspace
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Compatible Services
  mcp-server:
    image: mcp/server:latest
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8080}:8080"
    environment:
      MCP_STORAGE_PATH: /app/mcp-data
      MCP_SERVER_NAME: "opencode-mcp"
    volumes:
      - mcp-data:/app/mcp-data
      - mcp-logs:/app/logs

volumes:
  opencode-data:
  opencode-workspace:
  mcp-data:
  mcp-logs: