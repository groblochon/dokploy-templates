services:
  n8n-cluster:
    image: n8nio/n8n:latest
    container_name: n8n-cluster
    restart: unless-stopped
    environment:
      # High Availability Mode
      EXECUTORS_WORKERS_PROCESSES: "${N8N_WORKERS:-2}"
      EXECUTORS_WORKERS_PROCESS_TIMEOUT: "${N8N_WORKER_TIMEOUT:-300}"
      # Database (Supabase)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: "${POSTGRES_HOST}"
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB}"
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      # Redis Cluster
      QUEUE_BULL_REDIS_HOST: redis://redis-cluster:6379
      QUEUE_BULL_REDIS_PORT: 6379
      CACHE_REDIS_HOST: redis://redis-cluster:6379
      CACHE_REDIS_PORT: 6379
      # OpenAI Configuration
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_API_BASE: "${OPENAI_API_BASE}"
      # S3 Configuration
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      AWS_STORAGE_BUCKET_NAME: "${S3_BUCKET}"
      AWS_S3_ENDPOINT_URL: "${S3_ENDPOINT}"
      AWS_S3_REGION_NAME: "${S3_REGION}"
    ports:
      - "${PORT:-5678}:5678"
    volumes:
      - n8n-cluster-data:/home/node/.n8n
    depends_on:
      - redis-cluster
      - supabase-db

  redis-cluster:
    image: redis:alpine
    container_name: redis-cluster
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file /etc/redis/cluster.conf
    volumes:
      - redis-cluster-data:/data
      - redis-cluster-config:/etc/redis

volumes:
  n8n-cluster-data: {}
  redis-cluster-data: {}
  redis-cluster-config: {}