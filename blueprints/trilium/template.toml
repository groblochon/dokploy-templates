[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "trilium"
port = 80
host = "trilium.${main_domain}"

[[config.domains]]
serviceName = "trilium"
port = 80
host = "trilium-realtime.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# Port Configuration
HTTP_PORT = "${{project.HTTP_PORT}}"
REALTIME_PORT = "${{project.REALTIME_PORT}}"

# S3 Configuration
S3_ENDPOINT = "${{project.S3_ENDPOINT}}"
S3_REGION = "${{project.S3_REGION}}"
S3_BUCKET = "${{project.S3_BUCKET}}"
S3_ACCESS_KEY_ID = "${{project.S3_ACCESS_KEY_ID}}"
S3_SECRET_ACCESS_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"

[[config.mounts]]
volumeName = "trilium-data"
mountPath = "/root/.trilium-data"