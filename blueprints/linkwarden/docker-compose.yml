services:
  linkwarden:
    build:
      context: https://github.com/linkwarden/linkwarden.git#v2.9.3
    restart: unless-stopped
    expose:
      - 3000
    environment:
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "https://${LINKWARDEN_HOST}/api/v1/auth"
      # Database Configuration
      DATABASE_URL: "${POSTGRES_URL}"
      # S3 Configuration
      SPACES_ENDPOINT: "${S3_ENDPOINT}"
      SPACES_REGION: "${S3_REGION}"
      SPACES_BUCKET_NAME: "${S3_BUCKET}"
      SPACES_KEY: "${S3_ACCESS_KEY_ID}"
      SPACES_SECRET: "${S3_SECRET_ACCESS_KEY}"
    volumes:
      - linkwarden-data:/data/data
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://linkwarden:3000" ]
      interval: 60s
      retries: 2
      start_period: 60s
      timeout: 15s

volumes:
  linkwarden-data: {}
