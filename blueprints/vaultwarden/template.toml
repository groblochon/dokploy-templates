[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "vaultwarden"
port = 80
host = "vaultwarden.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# Configuration
DOMAIN = "https://vaultwarden.${main_domain}"
SIGNUPS_ALLOWED = "true"

[[config.mounts]]
volumeName = "vaultwarden-data"
mountPath = "/data"