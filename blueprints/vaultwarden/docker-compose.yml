services:
  vaultwarden:
    image: vaultwarden/server:1.34.3
    restart: unless-stopped
    expose:
      - 80
    environment:
      DOMAIN: "https://${DOMAIN}"
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED:-true}"
      # Database Configuration
      DATABASE_URL: "${POSTGRES_URL}"
    volumes:
      - vaultwarden-data:/data

volumes:
  vaultwarden-data: {}