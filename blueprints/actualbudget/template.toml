[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "actualbudget"
port = 5006
host = "actualbudget.${main_domain}"

[config.env]
# Database Configuration (connect to external Supabase)
ACTUAL_DATABASE_URL = "postgresql://postgres:${{project.POSTGRES_PASSWORD}}@${{project.POSTGRES_HOST}}:5432/${{project.POSTGRES_DB}}"

# S3 Configuration (using project variables)
AWS_ACCESS_KEY_ID = "${{project.AWS_ACCESS_KEY_ID}}"
AWS_SECRET_ACCESS_KEY = "${{project.AWS_SECRET_ACCESS_KEY}}"
AWS_REGION = "${{project.AWS_REGION}}"
AWS_BUCKET = "${{project.AWS_BUCKET}}"
AWS_S3_FORCE_PATH_STYLE = "true"

# Application Configuration
HTTP_PORT = "5006"
ACTUAL_TRUST_PROXY = "1"

# Password Configuration
PASSWORD_ENCRYPTION_KEY = "${password:32}"

[[config.mounts]]
volumeName = "actualbudget-data"
mountPath = "/app/data"

[[config.mounts]]
volumeName = "actualbudget-uploads"
mountPath = "/app/uploads"