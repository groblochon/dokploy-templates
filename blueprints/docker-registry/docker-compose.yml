services:
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION}
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${S3_ENDPOINT}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
    expose:
      - 5000
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://registry:5000/v2/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  registry-ui:
    image: joxit/docker-registry-ui:latest
    restart: unless-stopped
    environment:
      REGISTRY_TITLE: My Docker Registry
      REGISTRY_URL: http://registry:5000
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    expose:
      - 80
    depends_on:
      - registry
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://registry-ui:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes: # Local volume removed in favor of S3 storage
