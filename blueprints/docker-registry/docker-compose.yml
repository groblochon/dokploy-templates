services:
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry-data:/var/lib/registry
    expose:
      - 5000
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://registry:5000/v2/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  registry-ui:
    image: joxit/docker-registry-ui:latest
    restart: unless-stopped
    environment:
      REGISTRY_TITLE: My Docker Registry
      REGISTRY_URL: http://registry:5000
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    expose:
      - 80
    depends_on:
      - registry
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://registry-ui:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  registry-data:
