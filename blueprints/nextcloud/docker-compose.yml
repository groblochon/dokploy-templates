version: "3.8"

services:
  nextcloud:
    image: nextcloud:29-apache
    restart: unless-stopped
    expose:
      - 80
    environment:
      - NEXTCLOUD_ADMIN_USER="${NEXTCLOUD_ADMIN_USER}"
      - NEXTCLOUD_ADMIN_PASSWORD="${NEXTCLOUD_ADMIN_PASSWORD}"
      - NEXTCLOUD_TRUSTED_DOMAINS="${NEXTCLOUD_HOST}"
      - OVERWRITEPROTOCOL=https
      - OBJECTSTORE_S3_HOST=""${S3_HOST}"
      - OBJECTSTORE_S3_PORT=${S3_PORT}"
      - OBJECTSTORE_S3_SSL=true
      - OBJECTSTORE_S3_BUCKET="${S3_BUCKET}"
      - OBJECTSTORE_S3_KEY="${S3_ACCESS_KEY_ID}"
      - OBJECTSTORE_S3_SECRET="${S3_SECRET_ACCESS_KEY}"
      - OBJECTSTORE_S3_REGION="${S3_REGION}"
      - OBJECTSTORE_S3_USE_PATH_STYLE=true
    volumes:
      - nextcloud-data:/var/www/html
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    expose:
      - 5432
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD="${POSTGRES_PASSWORD}""
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - redis-data:/data

volumes:
  nextcloud-data: {}
  postgres-data: {}
  redis-data: {}