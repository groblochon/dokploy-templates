version: "3.8"

services:
  chatwoot:
    image: chatwoot/chatwoot:v3.14.1
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}}@${POSTGRES_HOST}}:5432/${POSTGRES_DB}}
      # Frontend URL
      FORCE_SSL: "true"
      FRONTEND_URL: "https://chatwoot.${main_domain}"
      # External Redis Configuration
      REDIS_URL: ${REDIS_URL}}
      # Email Configuration
      MAILER_SENDER_EMAIL: "${EMAIL_FROM}}"
      MAILER_DELIVERY_METHOD: "smtp"
      SMTP_DOMAIN: "${SMTP_HOST}}"
      SMTP_ADDRESS: "${SMTP_HOST}}"
      SMTP_PORT: "${SMTP_PORT}}"
      SMTP_USERNAME: "${SMTP_USERNAME}}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}}"
      SMTP_AUTHENTICATION: "plain"
      SMTP_ENABLE_STARTTLS: "true"
      # S3 Configuration (using project variables)
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}}"
      AWS_REGION: "${S3_REGION}}"
      AWS_BUCKET: "${S3_BUCKET}}"
      # Application Configuration
      RAILS_ENV: "production"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
    expose:
      - 3000
    volumes:
      - chatwoot-storage:/app/storage

  sidekiq:
    image: chatwoot/chatwoot:v3.14.1
    restart: unless-stopped
    environment:
      # Same configuration as main service
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}}@${POSTGRES_HOST}}:5432/${POSTGRES_DB}}
      REDIS_URL: ${REDIS_URL}}
      # S3 Configuration (using project variables)
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}}"
      AWS_REGION: "${S3_REGION}}"
      AWS_BUCKET: "${S3_BUCKET}}"
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - chatwoot
    volumes:
      - chatwoot-storage:/app/storage

volumes:
  chatwoot-storage: