services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    expose:
      - 3001
    environment:
      STORAGE_DIR: /app/server/storage
      # OpenAI Configuration
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_PATH: ${OPENAI_API_BASE}
      # Vector DB Configuration
      VECTOR_DB: pgvector
      PGVECTOR_CONNECTION_STRING: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      # S3 Configuration
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_ENDPOINT: ${S3_ENDPOINT}
      STORAGE_S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - anythingllm-data:/app/server/storage
    cap_add:
      - SYS_ADMIN

volumes:
  anythingllm-data: {}