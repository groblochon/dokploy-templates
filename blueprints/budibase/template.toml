[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "budibase"
port = 3000
host = "budibase.${main_domain}"

[config.env]
# Database Configuration (connect to external PostgreSQL)
POSTGRES_URL = "${{project.POSTGRES_URL}}"
DATABASE_URL = "${{project.POSTGRES_URL}}"

# External Redis for caching and sessions
REDIS_URL = "${{project.REDIS_URL}}"

# App Configuration
JWT_SECRET = "${password:32}"

# S3 Configuration (using project variables)
AWS_ACCESS_KEY_ID = "${{project.S3_ACCESS_KEY_ID}}"
AWS_SECRET_ACCESS_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"
AWS_REGION = "${{project.S3_REGION}}"
AWS_BUCKET = "${{project.S3_BUCKET}}"
AWS_S3_FORCE_PATH_STYLE = "true"
AWS_S3_ENDPOINT_URL = "${{project.S3_ENDPOINT}}"

# OpenAI Configuration (for AI features)
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"

# Email Configuration (for notifications and user management)
SMTP_HOST = "${{project.SMTP_HOST}}"
SMTP_PORT = "${{project.SMTP_PORT}}"
SMTP_USER = "${{project.SMTP_USERNAME}}"
SMTP_PASS = "${{project.SMTP_PASSWORD}}"
SMTP_SECURE = "true"

# Additional Budibase Configuration (commented - uncomment if needed)
# BUDIBASE_LOG_LEVEL = "info"
# BUDIBASE_PORT = "3000"
# BUDIBASE_ENVIRONMENT = "production"
# BUDIBASE_CHECK_FOR_UPDATES = "true"
# BUDIBASE_ENABLE_PUBLIC_PLUGINS = "false"
# BUDIBASE_PLUGINS_CDN_URL = "https://cdn.budi.ba"

[[config.mounts]]
volumeName = "budibase-data"
mountPath = "/data"