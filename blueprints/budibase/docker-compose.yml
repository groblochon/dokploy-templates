version: "3.8"

services:
  budibase:
    image: budibase/budibase:3.5.3
    restart: unless-stopped
    environment:
      # Database Configuration (connect to external Supabase)
      DATABASE_URL: "${POSTGRES_URL}"
      # External Redis for caching
      REDIS_URL: "${REDIS_URL}"
      # App Configuration
      JWT_SECRET: "${password:32}"
      # S3 Configuration (using project variables)
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      AWS_REGION: "${S3_REGION}"
      AWS_BUCKET: "${S3_BUCKET}"
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_ENDPOINT_URL: "${S3_ENDPOINT}"
      # OpenAI Configuration
      OPEN_AI_API_KEY: "${OPENAI_API_KEY}"
      OPEN_AI_API_URL: "${OPENAI_API_BASE}"
      # Email Configuration
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USERNAME}"
      SMTP_PASS: "${SMTP_PASSWORD}"
      SMTP_SECURE: "true"
    expose:
      - 3000
    volumes:
      - budibase-data:/data

volumes:
  budibase-data: {}