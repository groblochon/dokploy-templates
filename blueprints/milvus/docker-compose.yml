services:
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: milvus
    restart: unless-stopped
    ports:
      - "${REST_API_PORT:-19530}:19530"
      - "${GRPC_PORT:-9091}:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://milvus:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: "${MILVUS_MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MILVUS_MINIO_SECRET_KEY}"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://milvus-minio:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  milvus-data: {}
  milvus-etcd-data: {}
  milvus-minio-data: {}
