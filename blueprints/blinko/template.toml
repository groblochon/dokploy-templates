[variables]
main_domain = "${domain}"
blinko_secret = "${base64:32}"

[config]
[[config.domains]]
serviceName = "blinko"
port = 1111
host = "blinko.${main_domain}"

[config.env]
# Secrets
BLINKO_SECRET = "${blinko_secret}"

# Host Configuration
BLINKO_HOST = "blinko.${main_domain}"

# Database Configuration (connect to external PostgreSQL)
POSTGRES_HOST = "${{project.POSTGRES_HOST}}"
POSTGRES_DB = "${{project.POSTGRES_DB}}"
POSTGRES_PASSWORD = "${{project.POSTGRES_PASSWORD}}"

# OpenAI Configuration (optional)
OPENAI_API_BASE = "${{project.OPENAI_API_BASE}}"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"

# Additional Blinko Configuration (commented - uncomment if needed)
NODE_ENV = "production"
NEXTAUTH_URL = "https://blinko.${main_domain}"
# REDIS_URL = "${{project.REDIS_URL}}"
# DISABLE_SIGNUP = "false"
# MAX_FILE_SIZE = "100MB"

[[config.mounts]]
volumeName = "blinko-data"
mountPath = "/app/.blinko"

