services:
  blinko:
    image: blinkospace/blinko:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://${BLINKO_HOST}
      NEXTAUTH_SECRET: ${BLINKO_SECRET}
      DATABASE_URL: postgresql://postgres:${{project.POSTGRES_PASSWORD}}@${{project.POSTGRES_HOST}}:5432/${{project.POSTGRES_DB}}
      # OpenAI Configuration (optional)
      OPENAI_API_KEY: ${{project.OPENAI_API_KEY}}
      OPENAI_API_BASE: ${{project.OPENAI_API_BASE}}
    expose:
      - 1111
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://blinko:1111/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  blinko-data: {}
