[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "nhost"
port = 1337
host = "nhost.${main_domain}"

[config.env]
# Firebase Configuration (using project variables)
FIREBASE_PROJECT_ID = "${{project.FIREBASE_PROJECT_ID}}"
FIREBASE_PRIVATE_KEY: "${{project.FIREBASE_PRIVATE_KEY}}"
FIREBASE_DATABASE_URL: "${{project.FIREBASE_DATABASE_URL}}"
FIREBASE_STORAGE_BUCKET: "${{project.FIREBASE_STORAGE_BUCKET}}"

# S3 Fallback (using project variables)
AWS_ACCESS_KEY_ID = "${{project.AWS_ACCESS_KEY_ID}}"
AWS_SECRET_ACCESS_KEY = "${{project.AWS_SECRET_ACCESS_KEY}}"
AWS_REGION = "${{project.AWS_REGION}}"
AWS_BUCKET = "${{project.AWS_BUCKET}}"
AWS_S3_ENDPOINT_URL = "${{project.AWS_S3_ENDPOINT_URL}}"

# Application Configuration
HASURA_GRAPHQL_ENDPOINT = "https://graphql.nhost.run/v1"
HASURA_ADMIN_SECRET = "${password:32}"

[[config.mounts]]
volumeName = "nhost-data"
mountPath = "/var/lib/nhost"