services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    shm_size: 1g
    expose:
      - 11235
    environment:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_API_BASE: "${OPENAI_API_BASE}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://crawl4ai:11235/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
